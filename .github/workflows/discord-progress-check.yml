name: Discord progress check

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check issues/PR and notify Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLANNING_WEBHOOK: ${{ secrets.DISCORD_PLANNING_WEBHOOK }}
          BACKEND_WEBHOOK: ${{ secrets.DISCORD_BACKEND_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api() { curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          post() { curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" --data-binary @"$2" "$1"; }

          now_epoch=$(date -u +%s)
          window_sec=$((210*60))
          kst_date=$(date -u -d '+9 hours' +%Y-%m-%d)

          issue3=$(api issues/3); issue4=$(api issues/4); issue5=$(api issues/5); pr6=$(api pulls/6)
          c3=$(api issues/3/comments); c4=$(api issues/4/comments); c5=$(api issues/5/comments); c6=$(api issues/6/comments)
          allitems=$(api "issues?state=all&per_page=30")

          recent() {
            local updated="$1" comments="$2"
            local u_epoch c_epoch diff
            u_epoch=$(date -u -d "$updated" +%s 2>/dev/null || echo 0)
            diff=$((now_epoch - u_epoch))
            if [ "$diff" -le "$window_sec" ]; then echo true; return; fi
            c_epoch=$(echo "$comments" | jq -r 'map(.created_at) | max // empty' 2>/dev/null)
            [ -z "$c_epoch" ] && { echo false; return; }
            c_epoch=$(date -u -d "$c_epoch" +%s 2>/dev/null || echo 0)
            diff=$((now_epoch - c_epoch))
            if [ "$diff" -le "$window_sec" ]; then echo true; else echo false; fi
          }

          line() {
            local num="$1" label="$2" data="$3" comments="$4"
            local state updated cc act
            state=$(echo "$data" | jq -r '.state // "unknown"' | tr 'a-z' 'A-Z')
            updated=$(echo "$data" | jq -r '.updated_at // ""')
            cc=$(echo "$comments" | jq 'length')
            act=$(recent "$updated" "$comments")
            local marker=""
            [ "$act" = "true" ] && marker=" **[새 활동]**"
            echo "- #${num} ${label}: ${state}, 댓글 ${cc}개, 업데이트 ${updated}${marker}"
          }

          pr_state=$(echo "$pr6" | jq -r 'if .merged then "MERGED" elif .state == "open" then "OPEN" else "CLOSED" end')
          pr_line=$(line 6 "PR D-010 메인 아이디어 확정" "$pr6" "$c6")
          [ "$pr_state" = "MERGED" ] && pr_line="${pr_line} 🎉 **머지됨**"

          i3=$(line 3 "48시간 검증" "$issue3" "$c3")
          i4=$(line 4 "공식데이터 스파이크" "$issue4" "$c4")
          i5=$(line 5 "challenger 승인 패킷" "$issue5" "$c5")

          extra=$(echo "$allitems" | jq -r '[.[] | select(.number < 3 or .number > 6)] | if length > 0 then (map("- #\(.number) \(.title) (\(.state))") | join("\n")) else "" end')

          milestone="[일정상 정상]"
          if [[ "$kst_date" > "2026-07-27" ]]; then
            if [ "$(echo "$issue3" | jq -r .state)" = "open" ] || [ "$(echo "$issue4" | jq -r .state)" = "open" ] || [ "$(echo "$issue5" | jq -r .state)" = "open" ]; then
              milestone="[지연 가능성] 7/28 결정 시한 기준"
            fi
          elif [[ "$kst_date" > "2026-07-25" ]]; then
            milestone="[일정 확인 필요] 7/26~27 검증 구간"
          fi

          planning_body=$(printf '[진행체크] 21세기 집현전 (%s KST)\n\n%s\n%s\n%s\n%s\n\n마일스톤: %s\n%s' \
            "$kst_date" "$i3" "$i4" "$i5" "$pr_line" "$milestone" "${extra:+\n신규 항목:\n$extra}")

          backend_state=$(echo "$issue4" | jq -r '.state' | tr 'a-z' 'A-Z')
          backend_cc=$(echo "$c4" | jq 'length')
          backend_body=$(printf '[백엔드] 이슈 #4 공식데이터 스파이크: %s, 댓글 %s개\n마일스톤: %s' "$backend_state" "$backend_cc" "$milestone")

          jq -n --arg content "$planning_body" '{content:$content}' > planning.json
          jq -n --arg content "$backend_body" '{content:$content}' > backend.json

          status1=$(post "$PLANNING_WEBHOOK" planning.json)
          if [ "$status1" != "200" ] && [ "$status1" != "204" ]; then
            echo "planning webhook failed: $status1"
            jq -n --arg content "[진행체크 실패] 기획 채널 전송 오류 (status $status1) — repo 상태는 GitHub Actions 로그 참고" '{content:$content}' > fallback.json
            post "$BACKEND_WEBHOOK" fallback.json || true
          fi

          status2=$(post "$BACKEND_WEBHOOK" backend.json)
          if [ "$status2" != "200" ] && [ "$status2" != "204" ]; then
            echo "backend webhook failed: $status2"
          fi

          echo "planning=$status1 backend=$status2"
